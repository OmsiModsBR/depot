# The crates in Cargo.lock against the RustSec advisory database: when the lock file changes,
# and every Monday, since advisories are published for versions already in use. A crate with
# a known vulnerability fails the run; unmaintained and yanked crates are only listed. A
# [patch] of Cargo.toml that is no longer used fails it too.
name: Security audit

on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cargo.toml patches gpu-allocator with the project's fork. When an update makes wgpu
      # ask for another gpu-allocator version, Cargo leaves the patch out with only a warning
      # and the fork's fix is silently gone; Cargo.lock then lists the patch as unused.
      - name: Patches in use
        run: |
          if grep -q '^\[\[patch.unused\]\]' Cargo.lock; then
            grep -A2 '^\[\[patch.unused\]\]' Cargo.lock
            echo "::error file=Cargo.lock::A [patch.crates-io] entry of Cargo.toml is no longer used (above): move the fork to the version now asked for, or drop the patch."
            exit 1
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo audit
