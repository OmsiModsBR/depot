name: Depot build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-workspace:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OPENOMSI_VERSION: 0.2.17
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
      - name: Toolchain and immutable baseline
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          $baseline = 'c85b2e0dda13d219fd12d0496c653d20cdb54145'
          if ((git rev-parse depot-baseline-openomsi-0.2.16) -ne $baseline) { throw 'Baseline tag changed' }
          if ((git merge-base $baseline HEAD) -ne $baseline) { throw 'Baseline ancestry changed' }
      - name: Full workspace tests
        id: tests
        continue-on-error: true
        run: cargo test --locked --workspace --release --no-fail-fast
      - name: Full workspace release build
        id: build
        if: always()
        continue-on-error: true
        run: cargo build --locked --workspace --release
      - name: Check results
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.tests.outcome }}' -ne 'success' -or '${{ steps.build.outcome }}' -ne 'success') {
            throw 'Workspace tests or build failed; inspect the original diagnostics. No release was published.'
          }

  # Blocking: the committed third-party binaries must match the recorded hashes.
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Steam redistributables match SHA256SUMS
        run: cd assets/steam_redist && sha256sum -c SHA256SUMS

  # Informational quality gates: they never fail the workflow. Each step reports its own
  # outcome in the log and in the job summary; what is still pending is in docs/QUALITY.md.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: System libraries for clippy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libwayland-dev libasound2-dev libudev-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      # Crates formatted so far (macro-refactor plan, track 1): their check blocks. The rest of
      # the workspace is formatted crate by crate and stays informational until then.
      - name: rustfmt (formatted crates)
        run: cargo fmt -p omsi-cfg -p omsi-o3d -p omsi-model -p omsi-map -p omsi-vehicle -p omsi-scenery -p omsi-texture -p omsi-timetable -p omsi-content -p omsi-script -- --check
      - name: rustfmt (informational)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: clippy (informational)
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets
      - name: cargo audit and cargo deny (informational)
        continue-on-error: true
        run: |
          cargo install --locked cargo-audit cargo-deny
          cargo audit || echo "::warning::cargo audit reported findings"
          cargo deny check || echo "::warning::cargo deny reported findings"

  # Informational for now (docs/QUALITY.md): the offscreen golden on the software Vulkan
  # adapter (lavapipe), so the picture of the synthetic root is checked on every change without
  # a graphics card. OMSI_GOLDEN_REQUIRE makes a missing adapter or a missing golden for this
  # adapter fail instead of skip; the failure prints the golden to commit. Once it has passed
  # three runs in a row on the same commit, drop continue-on-error to make it blocking.
  offscreen-golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
      - name: System libraries and the software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libwayland-dev libasound2-dev libudev-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev mesa-vulkan-drivers libvulkan1
      - name: Offscreen golden on lavapipe
        env:
          OMSI_GOLDEN_RENDER: 1
          OMSI_GOLDEN_REQUIRE: 1
        run: |
          # only the software adapter, so a runner image that ever ships another driver does
          # not change which adapter the golden is compared on (the manifest's name varies
          # between mesa releases)
          VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          export VK_DRIVER_FILES VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          set +e
          cargo test --locked -p omsi-app --release --test offscreen_golden -- --nocapture 2>&1 | tee golden.log
          status=${PIPESTATUS[0]}
          {
            echo '### Offscreen golden (lavapipe)'
            echo '```'
            grep -E 'SKIP|golden|adapter=|backend=|thumb=|panicked|test result' golden.log | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Blocking on pull requests: the vehicle physics of the change against its base, frame by
  # frame (scripts/physics-trace-diff.sh, docs/QUALITY.md). A change that only moves code
  # leaves every trace identical. One meant to alter the physics carries the `physics-delta`
  # label: the job then lists where the traces differ without failing, for the review to
  # check against the change the pull request predicts.
  physics-traces:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libwayland-dev libasound2-dev libudev-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Physics traces against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # the pull request's labels as they are now: a re-run replays the event that started
          # the run, whose labels are those of that moment, so a label added since is not in it
          DELTA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq 'any(.labels[]; .name == "physics-delta")')
          scripts/physics-trace-diff.sh "$BASE_SHA" 2>&1 | tee physics-traces.log
          status=${PIPESTATUS[0]}
          {
            echo '### Vehicle physics traces'
            echo '```'
            grep -A 400 '^physics-trace-diff:' physics-traces.log | head -n 400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 1 ] && [ "$DELTA" = true ]; then
            echo "::warning::The physics traces differ from the base (label physics-delta): check them against the predicted change."
            exit 0
          fi
          exit "$status"

  # Informational for now: the offscreen run's state against the base, frame by frame
  # (scripts/offscreen-trace-diff.sh, docs/QUALITY.md) on the software Vulkan adapter. A change
  # that only moves code leaves the trace identical. One meant to alter the behaviour carries
  # the `offscreen-delta` label: the job then lists where the traces differ without failing.
  # It becomes blocking once two parity pull requests in a row passed it without a false alarm.
  offscreen-traces:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
      - name: System libraries and the software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libwayland-dev libasound2-dev libudev-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev mesa-vulkan-drivers libvulkan1
      - name: Offscreen state traces against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # only the software adapter (see offscreen-golden)
          VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          export VK_DRIVER_FILES VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          set +e
          # the pull request's labels as they are now (see physics-traces)
          DELTA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq 'any(.labels[]; .name == "offscreen-delta")')
          scripts/offscreen-trace-diff.sh "$BASE_SHA" 2>&1 | tee offscreen-traces.log
          status=${PIPESTATUS[0]}
          {
            echo '### Offscreen state traces'
            echo '```'
            grep -A 400 '^offscreen-trace-diff:' offscreen-traces.log | head -n 400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 1 ] && [ "$DELTA" = true ]; then
            echo "::warning::The offscreen state traces differ from the base (label offscreen-delta): check them against the predicted change."
            exit 0
          fi
          exit "$status"

  # Informational: how much of the rigid body's code (rigid/, its tests aside) the physics
  # scenarios and invariant tests reach - lines, regions and branches.
  physics-coverage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_TARGET_DIR: target/coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
          components: llvm-tools
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libwayland-dev libasound2-dev libudev-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - name: Coverage of the rigid body
        run: |
          tests="--test physics_traces --test physics_invariants"
          # branch coverage is still behind -Z on a stable toolchain; regions and lines without it
          export RUSTC_BOOTSTRAP=1 RUSTFLAGS="-C instrument-coverage -Z coverage-options=branch"
          if ! cargo test --locked -p omsi-sim --release $tests --no-run; then
            echo "::warning::branch coverage is not available on this toolchain; measuring regions and lines"
            export RUSTFLAGS="-C instrument-coverage"
          fi
          export LLVM_PROFILE_FILE="$PWD/target/coverage/prof/%p-%m.profraw"
          cargo test --locked -p omsi-sim --release $tests --no-run --message-format=json \
            | jq -r 'select(.profile.test == true) | .executable | select(. != null)' > test-binaries
          cargo test --locked -p omsi-sim --release $tests
          llvm="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          "$llvm/llvm-profdata" merge -sparse target/coverage/prof/*.profraw -o target/coverage/rigid.profdata
          # (the first binary goes where llvm-cov takes it, the others as -object)
          mapfile -t bins < test-binaries
          objects=()
          for b in "${bins[@]:1}"; do objects+=("-object=$b"); done
          "$llvm/llvm-cov" report "${bins[0]}" "${objects[@]}" -instr-profile=target/coverage/rigid.profdata -show-branch-summary \
            $(find "$PWD/crates/omsi-sim/src/rigid" -name '*.rs' ! -name tests.rs | sort) | tee coverage.txt
          { echo '### Coverage of the rigid body by the physics scenarios'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
