[package]
name = "omsi-launcher-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The launcher's data side: maps, buses, lines, profiles, settings, mod installs, running games"

[lib]
name = "omsi_launcher_lib"
path = "src/lib.rs"

[[bin]]
name = "depot-launcher"
path = "src/main.rs"

[build-dependencies]
winresource.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rayon.workspace = true
zip.workspace = true
flate2.workspace = true
omsi-cfg = { path = "../omsi-cfg" }
omsi-map = { path = "../omsi-map" }
omsi-vehicle = { path = "../omsi-vehicle" }
omsi-timetable = { path = "../omsi-timetable" }
omsi-content = { path = "../omsi-content" }
omsi-model = { path = "../omsi-model" }
omsi-net = { path = "../omsi-net", optional = true }

[features]
# checking a LAN join code or address (`describe_join`)
lan = ["dep:omsi-net"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd.workspace = true
