[package]
name = "omsi-launcher-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The launcher's look and pages (sidebar, Vehicles, Maps), drawn with omsi-ui; the game's launcher window hosts them"

[lib]
name = "omsi_launcher_ui"
path = "src/lib.rs"

[dependencies]
omsi-ui = { path = "../omsi-ui" }
omsi-launcher-core = { path = "../omsi-launcher-core" }
omsi-cfg = { path = "../omsi-cfg" }
serde_json.workspace = true
wgpu.workspace = true
glam.workspace = true
pollster.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
image.workspace = true

# the Profile page's drive times in the machine's time zone
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
omsi-ui = { path = "../omsi-ui", features = ["testing"] }
