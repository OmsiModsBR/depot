[package]
name = "omsi-render-d3d9"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Direct3D 9Ex renderer of the \"DirectX9 (D3D9Ex)\" render option"

# The game (Windows only) links it for the "DirectX9 (D3D9Ex)" render option, off by
# default; see README.md for the scope.
[dependencies]
thiserror.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
winit.workspace = true
