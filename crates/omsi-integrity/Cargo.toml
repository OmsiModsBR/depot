[package]
name = "omsi-integrity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Integrity check of a map's content: every file it needs is there, readable, and not wasteful for OMSI 2 / DirectX 9"

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-map = { path = "../omsi-map" }
omsi-model = { path = "../omsi-model" }
omsi-scenery = { path = "../omsi-scenery" }
omsi-o3d = { path = "../omsi-o3d" }
omsi-texture = { path = "../omsi-texture" }
