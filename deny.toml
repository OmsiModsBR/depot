# cargo-deny policy for Depot. Run informationally in CI (see docs/QUALITY.md); tighten
# once the findings listed there are resolved.

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Permissive licences only. Copyleft (GPL/LGPL/AGPL) must be reviewed by the maintainers.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (CA root data); maintainers to confirm
    "OpenSSL",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# gpu-allocator is patched to a fork in the workspace Cargo.toml
allow-git = ["https://github.com/openOMSI-Project/gpu-allocator"]
